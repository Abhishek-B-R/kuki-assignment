[project]
name = "kuki-sustainability"
version = "0.1.0"
description = "Evidence-first AI assistant for sustainability documents"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.8",
  "pymupdf>=1.24,<1.27",
  "openpyxl>=3.1",
  "google-genai>=1.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "json-repair>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
