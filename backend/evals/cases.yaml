# Evaluation cases. Each expected value was checked by hand against the documents in dataset/.
#
# Scoring (see evals/score.py):
#   must_include   every item must appear in the answer text or key values. An item is a list of
#                  alternatives; numbers match numerically (63,000 == 63000), strings case-insensitively.
#   expected_status  allowed answer statuses.
#   sources        evidence the answer must cite (verified or partial citation in that doc + page / sheet range).
#   must_flag      items that must appear in gaps / inconsistencies / assumptions / answer text.
#   must_not       regexes that must NOT match the answer text (wrong claims).
#   calculation    true when the answer must show at least one arithmetic step, all of which must recompute.

- id: C01
  title: Electricity per bill and billing period
  question: What electricity consumption does each bill report, and for which period?
  documents: [Adani commercial electricity bill.pdf, BESCOM Commercial Electricity Bill.pdf]
  expected_answer: >
    Adani (J Kumar MEPL JV, Mumbai): 47,407 kWh for the April 2024 bill, period 01-04-2024 to 30-04-2024
    (meter read 31-03-2024 to 30-04-2024). BESCOM (Prestige Estates, Bengaluru): 63,000 kWh net consumption
    for 01-06-2024 to 01-07-2024.
  expected_status: [answered]
  must_include:
    - [47407]
    - [63000]
    - [april 2024, apr 2024, apr-24, 01-04-2024, 2024-04-01, 1 april 2024, 01/04/2024, 31-03-2024]
    - [june 2024, jun 2024, 01-06-2024, 2024-06-01, 1 june 2024, 01/06/2024]
  sources:
    - {doc: Adani commercial electricity bill.pdf, pages: [1, 2]}
    - {doc: BESCOM Commercial Electricity Bill.pdf, pages: [1]}

