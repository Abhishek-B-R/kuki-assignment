- id: C11
  title: BESCOM recorded vs billing demand
  question: On the BESCOM bill, what was the recorded maximum demand and the billing demand, and why do they differ?
  documents: [BESCOM Commercial Electricity Bill.pdf]
  expected_answer: >
    Recorded demand 232 kVA; billing demand 675 kVA, which is 90% of the 750 kVA contract demand. Demand is billed
    on the higher of recorded demand and 90% of contract demand, so 675 kVA x Rs 365 = Rs 246,375.
  expected_status: [answered]
  must_include:
    - [232]
    - [675]
  must_flag:
    - ["90%", "90 %", "contract demand", "750"]
  sources:
    - {doc: BESCOM Commercial Electricity Bill.pdf, pages: [1]}

