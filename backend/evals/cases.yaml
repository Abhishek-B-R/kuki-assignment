  expected_answer: Yes. 14,821 - 12,500 = 2,321 cubic metres, which equals the 2,321 m3 billed for December 2025.
  expected_status: [answered]
  must_include:
    - [2321]
    - [14821]
    - [12500]
  calculation: true
  sources:
    - {doc: water_bill_invoice.pdf, pages: [1]}

