- id: C04
  title: Workbook monthly values vs annual summaries
  question: Do the workbook's monthly values and annual summaries agree?
  documents: [Annual Electricity Consumption.xlsx]
  expected_answer: >
    No. On 'Monthly Summary 2026' the ANNUAL TOTAL row understates grid supply (1,533,290 stated vs 1,534,290
    summed), total consumption (2,425,123 vs 2,426,123) and grid/net cost (13,798,610 vs 13,808,610). The
    Quarterly Summary disagrees too (e.g. Q1 total 585,323 vs 584,323 from the months; annual total 2,427,123).
  expected_status: [conflicting]
  must_include:
    - [1533290, 2425123, 13798610]
    - [1534290, 2426123, 13808610]
  must_flag:
    - ["1,000", "1000", "10,000", "10000"]
  sources:
    - {doc: Annual Electricity Consumption.xlsx, sheet: Monthly Summary 2026, cells: "B3:J16"}

- id: C05
  title: Complaint-resolution deadline in the policy (absent)
  question: Does the quality policy specify a deadline for resolving customer complaints?
  documents: [quality_policy_nestle.pdf]
  expected_answer: >
    No. The Food Safety and Quality Policy states commitments (food safety and compliance non-negotiable,
    quality end-to-end, everyone's responsibility) but sets no complaint-resolution deadline or timeframe.
  expected_status: [not_found, answered]
  must_include:
    - ["does not specify", "no deadline", "not specify", "does not mention", "no specific", "not mentioned",
       "no explicit", "does not contain", "does not include", "not specified", "does not set", "no timeframe",
       "no mention", "does not state", "not stated", "does not provide", "not include"]
  must_not:
    - 'within \d+\s*(working\s+)?(days|hours)'
  sources:
    - {doc: quality_policy_nestle.pdf, pages: [3]}

- id: C06
  title: Distinguishing amounts on the Adani bill
  question: On the Adani bill, what is the total amount payable, and how does it differ from the current month's bill amount?
  documents: [Adani commercial electricity bill.pdf]
  expected_answer: >
    Current month's bill (A) is Rs 632,023.17. After net other charges of Rs 510.00 credit (digital payment
    discount 500 + adjustment 10) and the previous balance of Rs 2.31, the total bill amount is Rs 631,515.48,
    shown rounded as Rs 631,510.00 payable by 30-05-2024 (Rs 626,420 if paid by the 16-05-2024 discount date,
    Rs 639,410 after the due date).
  expected_status: [answered]
  must_include:
    - [631515.48, 631510]
    - [632023.17]
    - [510]
  sources:
    - {doc: Adani commercial electricity bill.pdf, pages: [1, 2]}

- id: C07
  title: FY 2024-25 electricity across bills (two organisations, two months)
  question: What is the total electricity consumption for FY 2024-25, and how complete is the data?
  documents: all
  expected_answer: >
    Only two monthly bills fall in FY 2024-25, for different organisations: J Kumar MEPL JV (Adani, April 2024)
    47,407 kWh and Prestige Estates (BESCOM, June 2024) 63,000 kWh. Each covers 1 of 12 months, so no complete
    FY total exists; adding them (110,407 kWh) would mix organisations. The workbook (calendar 2026) is outside this FY.
  expected_status: [partial]
  must_include:
    - [47407]
    - [63000]
  must_flag:
    - ["different organisation", "two organisation", "two different", "separate organisation", "different compan",
       "different entit", "separate entit", "distinct organisation", "different consumer", "separate", "per organisation"]
    - ["1 of 12", "one month", "1 month", "11 months", "missing", "incomplete", "single month", "only one month"]
  sources:
    - {doc: Adani commercial electricity bill.pdf, pages: [1, 2]}
    - {doc: BESCOM Commercial Electricity Bill.pdf, pages: [1]}

